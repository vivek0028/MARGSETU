services:
  - type: web
    name: margsetu-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: margsetu-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: PORT
        value: "10000"

databases:
  - name: margsetu-db
    databaseName: railoptiblock
    user: postgres
    plan: free
